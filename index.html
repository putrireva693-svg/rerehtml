<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Penjual E-Commerce</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#0d6efd;
    color:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

.container{
    width:90%;
    margin:20px auto;
}

.dashboard{
    display:flex;
    gap:20px;
    margin-bottom:25px;
}

.card{
    flex:1;
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h2{
    color:#0d6efd;
    margin-top:10px;
}

h1{
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

table th{
    background:#0d6efd;
    color:white;
    padding:12px;
}

table td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

button{
    padding:8px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:white;
}

.edit{
    background:orange;
}

.hapus{
    background:red;
}

.tambah{
    background:green;
    margin:15px 0;
    padding:10px 18px;
}
</style>
</head>

<body>

<header>
    <h2>Seller E-Commerce</h2>

    <nav>
        <a href="#">Dashboard</a>
        <a href="#">Produk</a>
        <a href="#">Pesanan</a>
        <a href="#">Logout</a>
    </nav>
</header>

<div class="container">

<h1>Dashboard Penjual</h1>

<div class="dashboard">

<div class="card">
    <h3>Total Produk</h3>
    <h2>25</h2>
</div>

<div class="card">
    <h3>Pesanan</h3>
    <h2>12</h2>
</div>

<div class="card">
    <h3>Pendapatan</h3>
    <h2>Rp5.200.000</h2>
</div>

</div>

<button class="tambah">+ Tambah Produk</button>

<table>
<tr>
    <th>No</th>
    <th>Nama Produk</th>
    <th>Harga</th>
    <th>Stok</th>
    <th>Aksi</th>
</tr>

<tr>
    <td>1</td>
    <td>Sepatu Sneakers</td>
    <td>Rp350.000</td>
    <td>20</td>
    <td>
        <button class="edit">Edit</button>
        <button class="hapus">Hapus</button>
    </td>
</tr>

<tr>
    <td>2</td>
    <td>Kaos Polos</td>
    <td>Rp80.000</td>
    <td>35</td>
    <td>
        <button class="edit">Edit</button>
        <button class="hapus">Hapus</button>
    </td>
</tr>

<tr>
    <td>3</td>
    <td>Tas Ransel</td>
    <td>Rp220.000</td>
    <td>15</td>
    <td>
        <button class="edit">Edit</button>
        <button class="hapus">Hapus</button>
    </td>
</tr>

</table>

</div>

</body>
</html>

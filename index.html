<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Beauty - Selamat Datang ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --pink-pastel: #FFB6C1;
            --pink-hot: #FF69B4;
            --pink-light: #FFF0F5;
            --text-color: #5A4B51;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, var(--pink-light), #FFE4E1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 100px;
            height: 100px;
            background: var(--pink-pastel);
            border-radius: 50%;
            opacity: 0.5;
        }
        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--pink-hot);
            font-size: 2.8rem;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .tab-buttons {
            display: flex;
            background: var(--pink-light);
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 25px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: 12px;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: white;
            color: var(--pink-hot);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group label {
            font-size: 0.85rem;
            color: var(--text-color);
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }
        .input-box {
            position: relative;
        }
        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--pink-hot);
        }
        .input-box input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border: 2px solid #FFE4E1;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
        }
        .input-box input:focus {
            border-color: var(--pink-hot);
        }
        .btn-pink {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, var(--pink-pastel), var(--pink-hot));
            border: none;
            border-radius: 15px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
            transition: all 0.3s;
        }
        .btn-pink:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.6);
        }
        .customer-sec {
            display: none;
        }
        .icon-header {
            font-size: 2.5rem;
            color: var(--pink-hot);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="icon-header"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <h1>Pink Beauty</h1>
    <p class="subtitle">Makeup & Skincare Aesthetic Store</p>

    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('pelanggan')"><i class="fa-solid fa-user-heart"></i> Pelanggan</button>
        <button class="tab-btn" onclick="switchTab('admin')"><i class="fa-solid fa-user-shield"></i> Admin</button>
    </div>

    <!-- Form Admin -->
    <div id="adminForm">
        <form onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label>Username Admin</label>
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="adminUser" placeholder="Masukkan username" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="adminPass" placeholder="Masukkan password" required>
                </div>
            </div>
            <button type="submit" class="btn-pink"><i class="fa-solid fa-right-to-bracket"></i> Masuk Admin</button>
        </form>
    </div>

    <!-- Form Pelanggan -->
    <div id="pelangganForm" style="display: none;">
        <p style="margin-bottom: 20px; font-size: 0.95rem; color: #666;">Nikmati kemudahan belanja produk kecantikan kesukaanmu sekarang! 💕</p>
        <button onclick="window.location.href='index.html'" class="btn-pink">
            <i class="fa-solid fa-bag-shopping"></i> Masuk Toko Sekarang
        </button>
    </div>
</div>

<script>
    function switchTab(type) {
        const btns = document.querySelectorAll('.tab-btn');
        const adminF = document.getElementById('adminForm');
        const pelangganF = document.getElementById('pelangganForm');

        if (type === 'admin') {
            btns[0].classList.remove('active');
            btns[1].classList.add('active');
            adminF.style.display = 'block';
            pelangganF.style.display = 'none';
        } else {
            btns[1].classList.remove('active');
            btns[0].classList.add('active');
            adminF.style.display = 'none';
            pelangganF.style.display = 'block';
        }
    }

    function handleAdminLogin(e) {
        e.preventDefault();
        const u = document.getElementById('adminUser').value;
        const p = document.getElementById('adminPass').value;

        if (u === 'admin' && p === '12345') {
            localStorage.setItem('isAdminLoggedIn', 'true');
            window.location.href = 'admin.html';
        } else {
            alert('Username atau password admin salah! 💕');
        }
    }
</script>

</body>
</html>
